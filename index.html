
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Yaneth 💛</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* PANTALLAS */
.pantalla {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: opacity 1s;
}

/* INTRO */
#intro {
    background: linear-gradient(#fff7cc, #ffd633);
}

#intro h1 {
    color: #5a4a00;
}

/* MAIN */
#main {
    background: radial-gradient(circle, #fff7cc, #ffd633);
    opacity: 0;
}

/* FLOR */
.flor {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 20px;
}

.petalo {
    width: 60px;
    height: 100px;
    background: gold;
    border-radius: 50%;
    position: absolute;
    top: 25px;
    left: 45px;
    transform-origin: bottom center;
    opacity: 0;
    transition: all 0.8s ease;
}

.centro {
    width: 50px;
    height: 50px;
    background: brown;
    border-radius: 50%;
    position: absolute;
    top: 50px;
    left: 50px;
}

/* CARTA */
.carta {
    opacity: 0;
    transition: opacity 2s;
    text-align: center;
    padding: 20px;
    color: #5a4a00;
}

/* BOTONES */
button {
    padding: 15px 25px;
    font-size: 18px;
    background: #ffcc00;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
}

/* BRILLOS */
.sparkle {
    position: absolute;
    font-size: 20px;
    animation: brillar 2s infinite;
}

@keyframes brillar {
    0% {opacity: 0;}
    50% {opacity: 1;}
    100% {opacity: 0;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="pantalla" id="intro">
    <h1>Esto es para ti, Yaneth 💛</h1>
    <button onclick="entrar()">Abrir 💌</button>
</div>

<!-- MAIN -->
<div class="pantalla" id="main">

    <h2>Para Yaneth 🌻</h2>

    <div class="flor">
        <div class="petalo" id="p1"></div>
        <div class="petalo" id="p2"></div>
        <div class="petalo" id="p3"></div>
        <div class="petalo" id="p4"></div>
        <div class="petalo" id="p5"></div>
        <div class="petalo" id="p6"></div>
        <div class="petalo" id="p7"></div>
        <div class="petalo" id="p8"></div>
        <div class="centro"></div>
    </div>

    <button onclick="florecer()">Haz florecer 🌻</button>

    <div class="carta" id="carta">
        <p>
        Yaneth... 💛<br><br>
        Desde que llegaste a mi vida todo florece más bonito 🌻<br><br>
        No importa la distancia ni los días difíciles,<br>
        porque siempre que pienso en ti… todo mejora.<br><br>
        Eres mi lugar favorito, mi paz y lo mejor que me ha pasado.<br><br>
        Te amo muchísimo 💛
        </p>

        <button onclick="responder()">💌 Responder</button>
    </div>

</div>

<audio id="musica" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
function entrar() {
    document.getElementById("intro").style.opacity = "0";

    setTimeout(() => {
        document.getElementById("intro").style.display = "none";
        document.getElementById("main").style.opacity = "1";
    }, 1000);
}

function florecer() {
    let audio = document.getElementById("musica");
    audio.play();

    let angulos = [0,45,90,135,180,225,270,315];

    angulos.forEach((angulo, i) => {
        let p = document.getElementById("p" + (i+1));

        setTimeout(() => {
            p.style.opacity = "1";
            p.style.transform =
            "rotate(" + angulo + "deg) translateY(-60px)";
        }, i * 200);
    });

    document.getElementById("carta").style.opacity = "1";

    crearBrillos();
}

function responder() {
    alert("Ahora te toca a ti decirme cuánto me amas 😏💛");
}

function crearBrillos() {
    setInterval(() => {
        let s = document.createElement("div");
        s.className = "sparkle";
        s.innerText = "✨";

        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";

        document.body.appendChild(s);

        setTimeout(() => s.remove(), 2000);
    }, 300);
}
</script>

</body>
</html>
